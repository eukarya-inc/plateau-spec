name: Generate Docs

on:
  workflow_dispatch:
    inputs:
      document_type:
        description: 'Document type to generate'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - standard
          - procedure

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0

      - name: Setup Go
        uses: actions/setup-go@v5.6.0
        with:
          go-version-file: cmd/go.mod
          cache-dependency-path: cmd/go.sum

      - name: Build CLI
        run: |
          cd cmd
          go build -o ../bin/specgen .

      - name: Generate standard docs
        if: inputs.document_type == 'all' || inputs.document_type == 'standard'
        run: |
          rm -r ./docs/standard
          ./bin/specgen -type standard -output ./docs/standard

      - name: Generate procedure docs
        if: inputs.document_type == 'all' || inputs.document_type == 'procedure'
        run: |
          rm -r ./docs/procedure
          ./bin/specgen -type procedure -output ./docs/procedure

      - name: Build indexgen
        run: go build -o ../bin/indexgen ./indexgen
        working-directory: cmd

      - name: Generate search index
        run: ./bin/indexgen -docs ./docs -output ./search-index.mokuji

      - name: Upload search index artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: search-index
          path: search-index.mokuji
          retention-days: 90

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7.0.11
        with:
          commit-message: "docs: update generated documentation and search index"
          title: "docs: update generated documentation and search index"
          body: |
            This PR updates the generated documentation and search index.

            Document type: ${{ inputs.document_type }}
          branch: docs/update-${{ github.run_id }}
          delete-branch: true
